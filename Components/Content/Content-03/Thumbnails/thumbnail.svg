<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Center aligned main heading - bolder skeleton -->
  <rect x="300" y="20" width="300" height="30" rx="3" ry="3" fill="#e0e0e0"/>
  
  <!-- Center aligned paragraph text skeleton lines -->
  <rect x="175" y="60" width="550" height="12" rx="3" ry="3" fill="#eeeeee"/>
  <rect x="250" y="80" width="400" height="12" rx="3" ry="3" fill="#eeeeee"/>
  
  <!-- First row of cards - 3 card containers with borders -->
  <rect x="55" y="180" width="250" height="180" rx="5" ry="5" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="325" y="180" width="250" height="180" rx="5" ry="5" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="595" y="180" width="250" height="180" rx="5" ry="5" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  
  <!-- Second row of cards -->
  <rect x="55" y="380" width="250" height="180" rx="5" ry="5" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="325" y="380" width="250" height="180" rx="5" ry="5" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="595" y="380" width="250" height="180" rx="5" ry="5" fill="#ffffff" stroke="#e6e6e6" stroke-width="1"/>
  
  <!-- Icon placeholders - light purple circles -->
  <circle cx="95" cy="220" r="25" fill="#f0f1fe" stroke="#e6e6fa" stroke-width="1"/>
  <circle cx="365" cy="220" r="25" fill="#f0f1fe" stroke="#e6e6fa" stroke-width="1"/>
  <circle cx="635" cy="220" r="25" fill="#f0f1fe" stroke="#e6e6fa" stroke-width="1"/>
  <circle cx="95" cy="420" r="25" fill="#f0f1fe" stroke="#e6e6fa" stroke-width="1"/>
  <circle cx="365" cy="420" r="25" fill="#f0f1fe" stroke="#e6e6fa" stroke-width="1"/>
  <circle cx="635" cy="420" r="25" fill="#f0f1fe" stroke="#e6e6fa" stroke-width="1"/>
  
  <!-- Card headings - first row - bolder -->
  <rect x="80" y="265" width="150" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="350" y="265" width="150" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="620" y="265" width="150" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  
  <!-- Card headings - second row - bolder -->
  <rect x="80" y="465" width="150" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="350" y="465" width="150" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="620" y="465" width="150" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  
  <!-- Card paragraph text - first row -->
  <rect x="80" y="295" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="80" y="315" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="350" y="295" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="350" y="315" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="620" y="295" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="620" y="315" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <!-- Card paragraph text - second row -->
  <rect x="80" y="495" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="80" y="515" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="350" y="495" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="350" y="515" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="620" y="495" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="620" y="515" width="200" height="10" rx="2" ry="2" fill="#eeeeee"/>
</svg>
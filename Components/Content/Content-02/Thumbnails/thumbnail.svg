<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <!-- Background -->
  <rect width="900" height="400" fill="#f8f9fa" rx="5" ry="5"/>
  
  <!-- Left aligned main heading - bolder skeleton -->
  <rect x="47" y="60" width="350" height="28" rx="3" ry="3" fill="#e0e0e0"/>
  
  <!-- Blue underline below heading -->
  <rect x="47" y="95" width="125" height="4" rx="2" ry="2" fill="#6366f1"/>
  
  <!-- Right aligned paragraph text skeleton lines -->
  <rect x="480" y="60" width="370" height="12" rx="3" ry="3" fill="#eeeeee"/>
  <rect x="480" y="80" width="370" height="12" rx="3" ry="3" fill="#eeeeee"/>
  <rect x="480" y="100" width="370" height="12" rx="3" ry="3" fill="#eeeeee"/>
  
  <!-- Card containers - light gray backgrounds -->
  <rect x="47" y="210" width="180" height="265" rx="5" ry="5" fill="#f1f1f1" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="247" y="210" width="180" height="265" rx="5" ry="5" fill="#f1f1f1" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="447" y="210" width="180" height="265" rx="5" ry="5" fill="#f1f1f1" stroke="#e6e6e6" stroke-width="1"/>
  <rect x="647" y="210" width="180" height="265" rx="5" ry="5" fill="#f1f1f1" stroke="#e6e6e6" stroke-width="1"/>
  
  <!-- Image placeholders with dimensions text -->
  <rect x="67" y="230" width="140" height="140" rx="3" ry="3" fill="#e6e6e6"/>
  <rect x="267" y="230" width="140" height="140" rx="3" ry="3" fill="#e6e6e6"/>
  <rect x="467" y="230" width="140" height="140" rx="3" ry="3" fill="#e6e6e6"/>
  <rect x="667" y="230" width="140" height="140" rx="3" ry="3" fill="#e6e6e6"/>
  
  <!-- Subtitle labels - light purple -->
  <rect x="67" y="400" width="60" height="10" rx="2" ry="2" fill="#c7d2fe"/>
  <rect x="267" y="400" width="60" height="10" rx="2" ry="2" fill="#c7d2fe"/>
  <rect x="467" y="400" width="60" height="10" rx="2" ry="2" fill="#c7d2fe"/>
  <rect x="667" y="400" width="60" height="10" rx="2" ry="2" fill="#c7d2fe"/>
  
  <!-- Title text under each card - bolder -->
  <rect x="67" y="420" width="120" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="267" y="420" width="120" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="467" y="420" width="120" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  <rect x="667" y="420" width="120" height="16" rx="2" ry="2" fill="#e0e0e0"/>
  
  <!-- Description text lines -->
  <rect x="67" y="450" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="67" y="470" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="67" y="490" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="267" y="450" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="267" y="470" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="267" y="490" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="467" y="450" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="467" y="470" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="467" y="490" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  
  <rect x="667" y="450" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="667" y="470" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
  <rect x="667" y="490" width="140" height="10" rx="2" ry="2" fill="#eeeeee"/>
</svg>
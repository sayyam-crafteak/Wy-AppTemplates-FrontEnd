<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580">
  <!-- Background -->
  <rect width="600" height="580" fill="#f5f7fa"/>
  
  <!-- Vertical Line -->
  <line x1="40" y1="20" x2="40" y2="560" stroke="#e6e9f0" stroke-width="2"/>
  
  <!-- First Item -->
  <circle cx="40" cy="90" r="15" fill="#e6e9f0"/>
  <text x="40" y="94" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  
  <circle cx="110" cy="90" r="35" fill="#e6e9f0"/>
  <rect x="175" y="75" width="140" height="15" rx="3" fill="#e6e9f0"/>
  <rect x="175" y="100" width="300" height="10" rx="3" fill="#e6e9f0" opacity="0.7"/>
  
  <!-- Second Item -->
  <circle cx="40" cy="235" r="15" fill="#e6e9f0"/>
  <text x="40" y="239" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">2</text>
  
  <circle cx="110" cy="235" r="35" fill="#e6e9f0"/>
  <rect x="175" y="220" width="140" height="15" rx="3" fill="#e6e9f0"/>
  <rect x="175" y="245" width="300" height="10" rx="3" fill="#e6e9f0" opacity="0.7"/>
  
  <!-- Third Item -->
  <circle cx="40" cy="380" r="15" fill="#e6e9f0"/>
  <text x="40" y="384" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">3</text>
  
  <circle cx="110" cy="380" r="35" fill="#e6e9f0"/>
  <rect x="175" y="365" width="140" height="15" rx="3" fill="#e6e9f0"/>
  <rect x="175" y="390" width="300" height="10" rx="3" fill="#e6e9f0" opacity="0.7"/>
  
  <!-- Fourth Item -->
  <circle cx="40" cy="525" r="15" fill="#e6e9f0"/>
  <text x="40" y="529" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">4</text>
  
  <circle cx="110" cy="525" r="35" fill="#e6e9f0"/>
  <rect x="175" y="510" width="140" height="15" rx="3" fill="#e6e9f0"/>
  <rect x="175" y="535" width="300" height="10" rx="3" fill="#e6e9f0" opacity="0.7"/>
  
  <!-- Pulse Animation -->
  <rect width="100%" height="100%" fill="url(#pulse)">
    <animate attributeName="opacity" values="0;0.1;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#e6e9f0"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
      <animate attributeName="x1" values="0;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
</svg>
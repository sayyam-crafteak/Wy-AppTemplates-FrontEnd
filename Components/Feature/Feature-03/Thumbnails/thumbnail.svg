<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <!-- Background -->
  <rect width="800" height="220" fill="#f5f7fa"/>
  
  <!-- First Card -->
  <rect x="30" y="20" width="360" height="180" rx="6" fill="#ffffff" stroke="#e6e9f0" stroke-width="1"/>
  <circle cx="105" cy="95" r="35" fill="#e6e9f0"/>
  <rect x="185" y="75" width="170" height="16" rx="3" fill="#e6e9f0"/>
  <rect x="185" y="105" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="185" y="120" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="185" y="150" width="80" height="10" rx="3" fill="#e6e9f0" opacity="0.5"/>
  
  <!-- Second Card -->
  <rect x="410" y="20" width="360" height="180" rx="6" fill="#ffffff" stroke="#e6e9f0" stroke-width="1"/>
  <circle cx="485" cy="95" r="35" fill="#e6e9f0"/>
  <rect x="565" y="75" width="170" height="16" rx="3" fill="#e6e9f0"/>
  <rect x="565" y="105" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="565" y="120" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="565" y="150" width="80" height="10" rx="3" fill="#e6e9f0" opacity="0.5"/>
  
  <!-- Pulse Animation -->
  <rect width="100%" height="100%" fill="url(#pulse)">
    <animate attributeName="opacity" values="0;0.1;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#e6e9f0"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
      <animate attributeName="x1" values="0;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
</svg>
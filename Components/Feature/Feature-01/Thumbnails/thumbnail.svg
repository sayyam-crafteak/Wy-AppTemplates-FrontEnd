<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- Background -->
  <rect width="800" height="200" fill="#f5f7fa"/>
  
  <!-- Title Area - Bold Highlight -->
  <rect x="250" y="20" width="300" height="24" rx="4" fill="#d1d9e6" opacity="0.8"/>
  <rect x="320" y="55" width="160" height="20" rx="4" fill="#d1d9e6" opacity="0.7"/>
  
  <!-- First Card -->
  <circle cx="40" cy="140" r="20" fill="#e6e9f0"/>
  <rect x="80" y="125" width="170" height="12" rx="3" fill="#e6e9f0"/>
  <rect x="80" y="145" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="80" y="160" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="80" y="175" width="80" height="10" rx="3" fill="#e6e9f0" opacity="0.5"/>
  
  <!-- Second Card -->
  <circle cx="310" cy="140" r="20" fill="#e6e9f0"/>
  <rect x="350" y="125" width="170" height="12" rx="3" fill="#e6e9f0"/>
  <rect x="350" y="145" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="350" y="160" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="350" y="175" width="80" height="10" rx="3" fill="#e6e9f0" opacity="0.5"/>
  
  <!-- Third Card -->
  <circle cx="580" cy="140" r="20" fill="#e6e9f0"/>
  <rect x="620" y="125" width="170" height="12" rx="3" fill="#e6e9f0"/>
  <rect x="620" y="145" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="620" y="160" width="170" height="8" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="620" y="175" width="80" height="10" rx="3" fill="#e6e9f0" opacity="0.5"/>
  
  <!-- Pulse Animation -->
  <rect width="100%" height="100%" fill="url(#pulse)">
    <animate attributeName="opacity" values="0;0.1;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#e6e9f0"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
      <animate attributeName="x1" values="0;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
</svg>
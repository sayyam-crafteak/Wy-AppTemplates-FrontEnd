<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f5f7fa"/>
  
  <!-- Header Area -->
  <rect x="250" y="30" width="300" height="24" rx="4" fill="#d1d9e6" opacity="0.8"/>
  <rect x="150" y="80" width="500" height="10" rx="3" fill="#e6e9f0" opacity="0.7"/>
  <rect x="180" y="100" width="440" height="10" rx="3" fill="#e6e9f0" opacity="0.7"/>
  
  <!-- First Row of Items -->
  <rect x="115" y="180" width="350" height="60" rx="5" fill="#f0f2f5"/>
  <circle cx="150" cy="210" r="15" fill="#e6e9f0"/>
  <rect x="185" y="200" width="150" height="16" rx="3" fill="#e6e9f0"/>
  
  <rect x="505" y="180" width="350" height="60" rx="5" fill="#f0f2f5"/>
  <circle cx="540" cy="210" r="15" fill="#e6e9f0"/>
  <rect x="575" y="200" width="150" height="16" rx="3" fill="#e6e9f0"/>
  
  <!-- Second Row of Items -->
  <rect x="115" y="260" width="350" height="60" rx="5" fill="#f0f2f5"/>
  <circle cx="150" cy="290" r="15" fill="#e6e9f0"/>
  <rect x="185" y="280" width="150" height="16" rx="3" fill="#e6e9f0"/>
  
  <rect x="505" y="260" width="350" height="60" rx="5" fill="#f0f2f5"/>
  <circle cx="540" cy="290" r="15" fill="#e6e9f0"/>
  <rect x="575" y="280" width="150" height="16" rx="3" fill="#e6e9f0"/>
  
  <!-- Third Row of Items -->
  <rect x="115" y="340" width="350" height="60" rx="5" fill="#f0f2f5"/>
  <circle cx="150" cy="370" r="15" fill="#e6e9f0"/>
  <rect x="185" y="360" width="150" height="16" rx="3" fill="#e6e9f0"/>
  
  <rect x="505" y="340" width="350" height="60" rx="5" fill="#f0f2f5"/>
  <circle cx="540" cy="370" r="15" fill="#e6e9f0"/>
  <rect x="575" y="360" width="150" height="16" rx="3" fill="#e6e9f0"/>
  
  <!-- Pulse Animation -->
  <rect width="100%" height="100%" fill="url(#pulse)">
    <animate attributeName="opacity" values="0;0.1;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#e6e9f0"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
      <animate attributeName="x1" values="0;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="1.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
</svg>